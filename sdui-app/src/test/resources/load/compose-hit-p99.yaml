name: compose-hit-p99
surface: home
endpoint: /v1/surfaces/home
# Carga fechada: cada worker envia a proxima requisicao ao receber a resposta da anterior.
arrival: closed_loop
concurrency: 32
warmup_seconds: 10
duration_seconds: 60
hit_ratio: 0.9
miss_ratio: 0.1
# Misses vem da expiracao do cache de arvore: rodar com sdui.tree-ttl-seconds curto (ex.: 1)
# para que a taxa de miss apareca sem variar headers nem criar chaves novas.
miss_generation: tree_ttl_expiry
p99_ms: 400
slo_e2e_p99_ms: 1200
# Executor: sdui-app/src/test/kotlin/br/com/empresa/sdui/load/HttpLoadGenerator.kt
# (gradlew :sdui-app:loadTest -PbaseUrl=http://localhost:8080). Resultados registrados em
# docs/performance/medicoes-2026-09-23.md.
headers:
  UI-Schema-Version: "3"
  Client-Platform: ios
  Client-Version: 8.14.2
  Client-Build: "81420"
  Accept-Language: pt-BR
  API-Version: "1"
  OS-Version: "18.1"
metrics:
  - compose.duration
  - compose.hit
  - compose.miss
  - compose.fallback
  - compose.singleflight.wait
  - payload.bytes
  - mapping.ms
  - serialize.ms
  - section.hydrate.ms
