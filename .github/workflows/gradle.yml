name: Build and Test - Java CI with Gradle

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*' # dispara em tags de release: v1.0.0, v2.1.3, etc.
  pull_request:
    branches:
      - main
      - develop

# Default seguro: nenhum token de escrita, jobs elevam permissão quando necessário.
permissions:
  contents: read

# Cancela execuções anteriores do mesmo ref (evita builds paralelos obsoletos em pushes rápidos).
concurrency:
  group: gradle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build & Test ────────────────────────────────────────────────
  # setup-gradle já valida o gradle-wrapper.jar (validate-wrappers: true por
  # padrão), então o job dedicado de wrapper-validation não é mais necessário.
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Resolvido no topo do job para permitir `if` condicional no step do Sonar.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          # fetch-depth: 0 faz um clone completo — o Sonar precisa do histórico
          # para blame/auto-assignment e para métricas de "new code" vs. código existente.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin # BUG original: "temurinjava-version" era uma chave inválida
          java-version: '25'

      # gradle/actions/setup-gradle gerencia ~/.gradle/caches e o wrapper entre runs.
      # cache-read-only em PRs evita que branches temporárias poluam o cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
          gradle-home-cache-includes: |
            caches
            notifications
          # Configuration cache acelera builds subsequentes (Gradle 9.x).
          configuration-cache-enabled: true
          # Sem build scans automáticos — evita publicar métricas de CI externamente.
          build-scan-publish: false

      # chmod +x para casos onde o bit executável não foi commitado no Git.
      # Solução definitiva: `git update-index --chmod=+x gradlew` e commit.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # clean apenas em release/main: garante artefato 100% limpo.
      # Em PRs e develop, o Build Cache recompila só o que mudou.
      - name: Build with Gradle
        run: >-
          ./gradlew
          ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && 'clean ' || '' }}build
          -x nativeCompile
          --stacktrace

      # Roda somente quando a secret existe (PRs de forks não têm acesso a secrets).
      - name: Run SonarCloud Analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: >-
          ./gradlew sonar
          -Dsonar.projectKey=$SONAR_PROJECT_KEY
          -Dsonar.organization=$SONAR_ORGANIZATION
          -Dsonar.host.url=https://sonarcloud.io

      # Relatório JaCoCo (XML + HTML) para inspeção manual ou consumo por Codecov.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 7

      # Apenas o bootJar — exclusões explícitas de plain/sources.
      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jar-files
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
            !build/libs/*-sources.jar
          if-no-files-found: warn
          retention-days: 7

  # ── Dependency Graph ────────────────────────────────────────────
  # Só em pushes (não em PRs) para não submeter grafos duplicados.
  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    permissions:
      contents: write # necessário para submeter o grafo de dependências
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # https://github.com/gradle/actions/blob/main/docs/dependency-submission.md
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
