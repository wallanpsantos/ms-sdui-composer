name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Sem este step o build rodava com o JDK padrão do runner, incompatível com o toolchain 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # Major flutuante (@v4) para sempre receber o bundle mais novo do CodeQL,
      # necessário para suportar Kotlin 2.4.x. O Dependabot não precisa acompanhar patch a patch.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Build manual: sem daemon e sem caches, para o compilador rodar de fato
      # e o CodeQL ter código para extrair (tasks FROM-CACHE não geram extração).
      - name: Build for CodeQL
        run: |
          chmod +x ./gradlew
          ./gradlew assemble testClasses \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache \
            --rerun-tasks \
            --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
