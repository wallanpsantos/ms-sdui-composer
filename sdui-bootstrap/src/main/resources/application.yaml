spring:
  application:
    name: ms-sdui-composer
  threads:
    virtual:
      enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

sdui:
  seed-ios: true
  rate-limit-capacity: 10000
  rate-limit-refill-per-second: 10000
  rate-limit-max-keys: 100000
  tree-ttl-seconds: 60
  tree-cache-max-entries: 10000
  hydration-timeout-ms: 80
  hydration-fanout: 8
  retry-after-seconds: 5
  canary-ios-builds: [ ]
  canary-android-builds: [ ]
