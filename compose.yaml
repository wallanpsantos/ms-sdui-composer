# Ambiente local do ms-sdui-composer.
#
#   docker compose up --build              sobe apenas o servico
#   docker compose --profile infra up -d   sobe tambem MongoDB e Redis
#
# O servico nao consome MongoDB nem Redis: todos os stores sao in-memory e as autoconfiguracoes
# dos dois estao excluidas em SduiApplication (ver AGENTS.md secao 17). Os dois containers ficam
# atras do profile `infra` para nao subirem por engano e darem a impressao de que ha persistencia;
# eles existem para quando os adapters forem cabeados.

services:
  sdui-composer:
    build:
      context: .
    image: ms-sdui-composer:local
    container_name: sdui-composer
    ports:
      - "8080:8080"
    environment:
      # Estado em memoria: uma instancia so. Publicar ou fazer rollback em uma replica nao afeta
      # as demais, entao escalar este compose horizontalmente daria divergencia de pointer.
      SPRING_APPLICATION_NAME: ms-sdui-composer
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
      # Limites operacionais — os mesmos nomes de application.yaml, em SCREAMING_SNAKE_CASE.
      SDUI_SEED_IOS: "true"
      SDUI_RATE_LIMIT_CAPACITY: "10000"
      SDUI_RATE_LIMIT_REFILL_PER_SECOND: "10000"
      SDUI_RATE_LIMIT_MAX_KEYS: "100000"
      SDUI_TREE_TTL_SECONDS: "60"
      SDUI_TREE_CACHE_MAX_ENTRIES: "10000"
      SDUI_HYDRATION_TIMEOUT_MS: "80"
      SDUI_HYDRATION_FANOUT: "8"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness" ]
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    # O plano administrativo (/admin/v1) nao tem autenticacao: o papel do ator vem de um header.
    # Enquanto for assim, este container nao pode ser exposto fora da maquina local.
    deploy:
      resources:
        limits:
          memory: 1g

  mongo:
    profiles: [ "infra" ]
    image: mongo:8.3
    container_name: sdui-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  redis:
    profiles: [ "infra" ]
    image: redis:8-alpine
    container_name: sdui-redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  mongo-data:
